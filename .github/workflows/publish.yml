name: Publish
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage for maintainer review or publish directly
        type: choice
        options: [stage, publish]
        default: stage
        required: true
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - name: Stage package with provenance
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'stage'
        run: npm stage publish --ignore-scripts --provenance --access public
      - name: Publish package with provenance
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        run: npm publish --ignore-scripts --provenance --access public
